name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test
        run: dotnet test tests/Cosmos.VisualStudio.Tests

      # The VSSDK tasks (command table, pkgdef, .vsix) need the .NET Framework MSBuild.
      - name: Package extension
        run: msbuild src/Cosmos.VisualStudio/Cosmos.VisualStudio.csproj /restore /p:Configuration=Release /v:minimal

      - name: Get version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/Cosmos.VisualStudio/source.extension.vsixmanifest
          "version=$($manifest.PackageManifest.Metadata.Identity.Version)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          files: src/Cosmos.VisualStudio/bin/Release/net472/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
